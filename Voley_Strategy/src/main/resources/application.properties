spring.application.name=Voley-strategy

# Conexion usando la red interna de Docker
spring.datasource.url=jdbc:mysql://mysql-db:3306/Voley-strategy?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Security - JWT
# IMPORTANTE: cambia este valor en produccion por uno aleatorio largo (min 32 caracteres)
jwt.secret=Voley-strategy-clave-secreta-jwt-2026-cambiar-en-produccion